<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.textDirection%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="REI Immobiliare — Agenzia immobiliare a Ivrea e nel Canavese. Valorizziamo il tuo patrimonio con professionalità e trasparenza."
		/>
		<meta property="og:title" content="REI Immobiliare — Agenzia Immobiliare a Ivrea" />
		<meta
			property="og:description"
			content="Valorizziamo il tuo patrimonio con professionalità e trasparenza. Vendita, acquisto e valutazioni immobiliari."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="it_IT" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300..700&family=Plus+Jakarta+Sans:wght@300..800&display=swap"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300..700&family=Plus+Jakarta+Sans:wght@300..800&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media = 'all'"
		/>
		<noscript>
			<link
				href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300..700&family=Plus+Jakarta+Sans:wght@300..800&display=swap"
				rel="stylesheet"
			/>
		</noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
